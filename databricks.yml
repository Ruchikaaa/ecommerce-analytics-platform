# Variable declarations to toggle between Dev and Prod Catalogs
variables:
  catalog_name:
    description: "The Unity Catalog to use for data storage"
    default: ecommerce_analytics_dev
  schema_name:
    description: "The target schema for DLT tables"
    default: bronze_layer

# Pull in the resource definitions
include:
  - resources/pipelines.yml
  - resources/jobs.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405614660800717.17.azuredatabricks.net
    variables:
      catalog_name: ecommerce_analytics_dev
      schema_name: bronze_layer

  prod:
    mode: production
    run_as:
      service_principal_name: "b3b580fc-1cd0-4cb3-a176-4bcf4d49945e"
    workspace:
      host: https://adb-7405612042809530.10.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: ecommerce_analytics_prod
      schema_name: bronze_layer