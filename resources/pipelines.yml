resources:
  pipelines:
    # 1. Using the OLD Resource Key to maintain state continuity
    pipeline_ecommerce_medallion_pipeline: 
      name: Ecommerce_Medallion_Pipeline
      
      # 2. Add this to bypass the "Name already used" error
      allow_duplicate_names: true 
      
      configuration:
        # Keep your clean dynamic variables
        source_path: /Volumes/${var.catalog_name}/${var.schema_name}/landing_csvs/${bundle.target}/
        spark.databricks.cloudFiles.schemaInference.sampleSize.numFiles: "10"

      libraries:
        # Use your updated, modular paths
        - notebook:
            path: ../src/01_Bronze_Ingestion/bronze_job.ipynb
        - notebook:
            path: ../src/02_Silver_Transformation/silver_cleaning.ipynb
        - notebook:
            path: ../src/03_Gold_Aggregations/01_dim_products.ipynb
        - notebook:
            path: ../src/03_Gold_Aggregations/02_fact_sales.ipynb
        - notebook:
            path: ../src/03_Gold_Aggregations/04_business_kpis.ipynb

      # 3. Dynamic target settings
      schema: ${var.schema_name}
      catalog: ${var.catalog_name}
      
      # 4. Performance settings
      photon: true
      serverless: true